<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hover Summary 诊断</title>
<style>
body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
.log { padding: 8px; margin: 4px 0; border-radius: 4px; }
.ok { background: #d4edda; color: #155724; }
.fail { background: #f8d7da; color: #721c24; }
.info { background: #d1ecf1; color: #0c5460; }
#report { white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<h1>Hover Summary 诊断</h1>
<div id="report">检测中...</div>
<script>
const log = [];
function add(cls, msg) {
  log.push(`[${cls}] ${msg}`);
  document.getElementById('report').innerHTML = log.map(l => {
    const c = l.match(/\[(\w+)\]/)[1];
    return `<div class="${c}">${l}</div>`;
  }).join('');
}

// 检测 1: chrome API 是否存在
if (typeof chrome === 'undefined') {
  add('fail', 'chrome API 不存在 — content script 未注入！扩展未加载或被 Chrome 拦截。');
  add('info', '请确认：1) chrome://extensions 开启开发者模式 2) 点击"加载已解压的扩展程序" 3) 选择 hover-summary 文件夹 4) 确认扩展已启用');
} else {
  add('ok', 'chrome API 存在');
  
  // 检测 2: chrome.runtime
  if (chrome.runtime) {
    add('ok', 'chrome.runtime 可用');
    
    // 检测 3: 发送 ping
    try {
      chrome.runtime.sendMessage({ action: 'ping' }, (resp) => {
        if (chrome.runtime.lastError) {
          add('fail', `Service Worker 通信失败: ${chrome.runtime.lastError.message}`);
          add('info', 'Service Worker 可能未启动或已崩溃。尝试在 chrome://extensions 点"重新加载"。');
        } else if (resp && resp.ok) {
          add('ok', 'Service Worker 响应正常');
        } else {
          add('fail', `Service Worker 异常响应: ${JSON.stringify(resp)}`);
        }
        
        // 检测 4: 获取配置
        chrome.runtime.sendMessage({ action: 'getConfig' }, (config) => {
          if (chrome.runtime.lastError) {
            add('fail', `获取配置失败: ${chrome.runtime.lastError.message}`);
          } else if (config) {
            add('ok', `配置: model=${config.model}, delay=${config.hoverDelay}ms`);
            if (config.model === 'agnes' && !config.agnes?.apiKey) {
              add('fail', 'Agnes API Key 未配置！点击扩展图标设置。');
            } else if (config.model === 'agnes' && config.agnes?.apiKey) {
              add('ok', `Agnes Key: ${config.agnes.apiKey.substring(0,8)}...`);
            }
          } else {
            add('fail', '配置为空');
          }
          
          // 检测 5: 实际 API 调用测试
          add('info', '开始测试 API 调用...');
          const testText = '人工智能是计算机科学的一个重要分支，致力于研究、开发用于模拟人类智能的理论和方法。';
          chrome.runtime.sendMessage({ action: 'summarize', text: testText }, (resp) => {
            if (chrome.runtime.lastError) {
              add('fail', `API 调用失败: ${chrome.runtime.lastError.message}`);
            } else if (resp && resp.success) {
              add('ok', `API 调用成功！耗时 ${resp.elapsed}s`);
              add('ok', `摘要: ${resp.summary}`);
            } else {
              add('fail', `API 调用失败: ${resp?.error || '未知'}`);
            }
            add('info', '诊断完成。将结果截图发给我。');
          });
        });
      });
    } catch(e) {
      add('fail', `sendMessage 异常: ${e.message}`);
    }
  } else {
    add('fail', 'chrome.runtime 不存在');
  }
}
</script>
</body>
</html>
